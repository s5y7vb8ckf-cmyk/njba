<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تسجيل دخول المشرفين - نادي نجباء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#16178f;--pink:#e91e63;--orange:#f5a000;--soft:#fff3f7;--text:#20213d;--muted:#73758c;--border:#e5e6f2}
*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,sans-serif}body{min-height:100vh;background:#fff;color:var(--text);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:38px 20px}.login-container{width:100%;max-width:430px;text-align:center;margin:auto}.login-logo-container{width:118px;height:118px;background:#fff;border-radius:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;border:1px solid var(--border);box-shadow:0 14px 35px rgba(22,23,143,.10)}.login-logo-container img{width:102px;height:102px;object-fit:contain}.login-header h2{font-size:26px;color:var(--blue);margin-bottom:6px;font-weight:800}.login-header p{color:var(--muted);font-size:14px;margin-bottom:25px}.role-selector{display:flex;background:#f5f5fb;padding:6px;border-radius:16px;margin-bottom:25px;border:1px solid var(--border)}.role-btn{flex:1;padding:12px;border:0;background:transparent;font-size:14px;font-weight:700;color:var(--muted);border-radius:12px;cursor:pointer}.role-btn.active{background:#fff;color:var(--pink);box-shadow:0 4px 12px rgba(233,30,99,.13)}.login-form-group{margin-bottom:20px;text-align:right}.login-form-group label{display:block;margin-bottom:8px;font-weight:700;font-size:13px;color:var(--blue)}.login-control{width:100%;padding:14px 18px;border:1px solid var(--border);border-radius:14px;font-size:16px;background:#fafafe;color:var(--text);transition:.2s}.login-control:focus{outline:none;border-color:var(--pink);background:#fff;box-shadow:0 0 0 4px rgba(233,30,99,.10)}.btn-login-submit{background:linear-gradient(135deg,var(--blue),#2426b9);color:#fff;padding:15px;border:0;border-radius:14px;cursor:pointer;font-size:15px;font-weight:700;width:100%;margin-top:10px}.btn-login-submit:hover{background:linear-gradient(135deg,var(--pink),#c91455)}.error-msg{background:#fef2f2;color:#ef4444;padding:12px;border-radius:12px;font-size:13px;margin-top:15px;border:1px solid #fecaca;display:none}.login-footer-text{color:var(--muted);font-size:12px;font-weight:600;text-align:center;margin-top:20px}.accent-line{height:4px;width:76px;margin:10px auto 22px;border-radius:99px;background:linear-gradient(90deg,var(--blue) 0 34%,var(--pink) 34% 68%,var(--orange) 68%)}
</style>
</head>
<body><div></div><div class="login-container"><div class="login-logo-container"><img src="logo-nujaba.png" alt="شعار نادي نجباء"></div><div class="login-header"><h2>تسجيل دخول المشرفين</h2><div class="accent-line"></div><p>بوابة الإدارة المركزية لنادي نجباء للفتيان</p></div><div class="role-selector"><button class="role-btn active" type="button">مشرف</button><button class="role-btn" type="button" onclick="location.href='index.html'">طالب</button></div><div class="login-form-group"><label>الكود</label><input type="text" id="loginCode" class="login-control" placeholder="أدخل كود المشرف" autocomplete="off"></div><div class="login-form-group"><label>كلمة السر</label><input type="password" id="loginPass" class="login-control" placeholder="••••••••"></div><button class="btn-login-submit" id="loginBtn" onclick="handleLogin()">تسجيل الدخول</button><div id="loginError" class="error-msg"></div></div><div class="login-footer-text">جميع الحقوق محفوظة © النظام الإداري لنادي نجباء 2026</div>
<script>
const SUPERVISORS_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSaCHiKgZZMaf8603SCRHKZs0Y9P4rW1zQG1udijGM24e9t83S41NKbv_DH80HlCeXwRW6IJLfnc7Ps/pub?gid=0&single=true&output=csv';
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;}else if(ch==='"')quoted=!quoted;else if(ch===','&&!quoted){row.push(cell.trim());cell='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);row=[];cell='';}else cell+=ch;}if(cell||row.length){row.push(cell.trim());rows.push(row);}rows.shift();return rows.map(r=>({code:(r[0]||'').trim(),pass:(r[1]||'').trim(),name:(r[2]||'مشرف معتمد').trim(),rank:(r[3]||'إداري').trim(),stage:(r[4]||'عام').trim()}));}
async function handleLogin(){const code=document.getElementById('loginCode').value.trim(),pass=document.getElementById('loginPass').value.trim(),err=document.getElementById('loginError'),btn=document.getElementById('loginBtn');err.style.display='none';if(!code||!pass){err.textContent='يرجى إدخال الكود وكلمة السر.';err.style.display='block';return;}try{btn.disabled=true;btn.textContent='جارٍ التحقق...';const res=await fetch(SUPERVISORS_CSV_URL,{cache:'no-store'});if(!res.ok)throw new Error();const supervisors=parseCSV(await res.text());const matched=supervisors.find(s=>s.code===code&&s.pass===pass);if(!matched){err.textContent='الكود أو كلمة المرور غير صحيحة.';err.style.display='block';return;}localStorage.setItem('nujaba_currentSupervisor',JSON.stringify(matched));location.href='dashboar.html';}catch(e){err.textContent='تعذر الاتصال ببيانات المشرفين.';err.style.display='block';}finally{btn.disabled=false;btn.textContent='تسجيل الدخول';}}
document.addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
</script></body></html>
